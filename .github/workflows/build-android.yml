name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            cmake libssl-dev libffi-dev \
            libltdl-dev libncurses5-dev \
            openjdk-17-jdk ccache \
            zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev \
            wget unzip git

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer 'cython<3.0'

      - name: Verify Chinese font (committed to repo)
        run: |
          # 字体已提交进仓库（fonts/NotoSansSC-Regular.otf，约 8.3MB），
          # 不再依赖 CDN 下载（旧 jsdelivr 地址 404，导致 APK 无字体、
          # 运行时回退系统 TTC 字体疑似引发原生层闪退）
          FONT=fonts/NotoSansSC-Regular.otf
          if [ ! -f "$FONT" ]; then
            echo "ERROR: $FONT missing from repo"; exit 1
          fi
          SIZE=$(stat -c%s "$FONT")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: $FONT too small ($SIZE bytes), likely corrupted"; exit 1
          fi
          echo "Font OK: $SIZE bytes"

      - name: Cache Android SDK & NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/tools
          key: android-sdk-ndk-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Prepare p4a (strip network deps from kivy recipe)
        run: |
          set -ex
          rm -rf /tmp/p4a
          git clone --depth 1 --single-branch --branch develop \
            https://github.com/kivy/python-for-android.git /tmp/p4a
          # kivy recipe 硬编码 python_depends = [certifi,chardet,idna,requests,urllib3,filetype]，
          # 其中 requests 会拉进 charset-normalizer>=3（自带编译扩展），p4a 会生成安卓专用 wheel，
          # 宿主机 pip 安装时报 "not a supported wheel on this platform"（p4a issue #2755）。
          # 我们的 app 不使用这些网络依赖，直接清空即可避免整条依赖链。
          python3 - <<'EOF'
          import re
          p = '/tmp/p4a/pythonforandroid/recipes/kivy/__init__.py'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r'python_depends\s*=\s*\[[^\]]*\]',
                      'python_depends = []', s)
          assert s2 != s, 'pattern not found'
          open(p, 'w', encoding='utf-8').write(s2)
          print('patched kivy python_depends -> []')
          EOF

      - name: Build APK (release)
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -ex
          # p4a 内置的 P4A_RELEASE_* 签名不可靠（p4a#1350 复现），此处先产出 unsigned APK，
          # 由下一步用 apksigner 显式做 v2/v3 签名。
          buildozer android release

      - name: Sign APK with apksigner (v2/v3)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          set -ex
          # 从 Secret 恢复 keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > colorassistant-release.jks
          ls -l colorassistant-release.jks
          # 定位 SDK 自带 apksigner（buildozer 已安装 SDK/build-tools）
          APKSIGNER=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ | tail -1)apksigner
          echo "Using apksigner: $APKSIGNER"
          UNSIGNED=$(ls bin/*-arm64-v8a-release-unsigned.apk | head -1)
          echo "Unsigned APK: $UNSIGNED"
          ls -l "$UNSIGNED"
          # 对 unsigned APK 做 v2+v3 签名（apksigner 自动对齐，比 jarsigner 更稳）
          # 版本号 = 1.2.4 + Git 短哈希，保证每个版本产物名不同、可溯源
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          VER="1.2.4-$SHORT_SHA"
          "$APKSIGNER" sign \
            --ks colorassistant-release.jks \
            --ks-key-alias colorassistant \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASS" \
            --key-pass "pass:$RELEASE_KEYSTORE_PASS" \
            --out "bin/colorassistant-${VER}-release-signed.apk" \
            "$UNSIGNED"
          # 移除 unsigned 产物，避免上传误用
          rm -f "$UNSIGNED"
          # 校验签名并打印证书信息
          "$APKSIGNER" verify --print-certs "bin/colorassistant-${VER}-release-signed.apk"
          echo "SIGNED_APK=$VER" >> "$GITHUB_ENV"
          echo "=== Signed APK ready ($VER) ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorassistant-${{ env.SIGNED_APK }}
          path: bin/*.apk
          retention-days: 30

      - name: Create GitHub Release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          TAG="v${SIGNED_APK}"
          APK_FILE=$(ls bin/colorassistant-*-release-signed.apk | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "ColorAssistant ${SIGNED_APK}" \
              --target "$GITHUB_SHA" \
              --notes "AI 调色助手 ${SIGNED_APK}

          安装：直接下载下方 .apk 文件（无需登录、无需解压），手机上点击安装。
          验证版本：启动画面和标题栏应显示 v1.2.4。"
          fi
          echo "=== Release URL ==="
          echo "https://github.com/CA6140-2018/color-assistant/releases/tag/${TAG}"

      - name: Print build info
        if: always()
        run: |
          echo "=== Build complete ==="
          ls -lh bin/ 2>/dev/null || echo "No bin/ directory (build may have failed)"
          echo ""
          echo "If build succeeded, download the APK from the Artifacts section above."
