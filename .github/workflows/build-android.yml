name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            cmake libssl-dev libffi-dev \
            libltdl-dev libncurses5-dev \
            openjdk-17-jdk ccache \
            zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev \
            wget unzip git

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer 'cython<3.0'

      - name: Download Chinese font (backup)
        run: |
          mkdir -p fonts
          # Try multiple sources; if all fail, app will use Android system font at runtime
          curl -sL -o fonts/NotoSansSC-Regular.otf \
            "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansSC-Regular.otf" \
            2>/dev/null || true
          if [ -f fonts/NotoSansSC-Regular.otf ]; then
            SIZE=$(stat -c%s fonts/NotoSansSC-Regular.otf 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000000 ]; then
              echo "Font downloaded: $SIZE bytes"
            else
              echo "Font file too small ($SIZE bytes), removing (likely LFS pointer)"
              rm -f fonts/NotoSansSC-Regular.otf
            fi
          else
            echo "Font download failed, will use system font at runtime"
          fi

      - name: Cache Android SDK & NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/tools
          key: android-sdk-ndk-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Prepare p4a (strip network deps from kivy recipe)
        run: |
          set -ex
          rm -rf /tmp/p4a
          git clone --depth 1 --single-branch --branch develop \
            https://github.com/kivy/python-for-android.git /tmp/p4a
          # kivy recipe 硬编码 python_depends = [certifi,chardet,idna,requests,urllib3,filetype]，
          # 其中 requests 会拉进 charset-normalizer>=3（自带编译扩展），p4a 会生成安卓专用 wheel，
          # 宿主机 pip 安装时报 "not a supported wheel on this platform"（p4a issue #2755）。
          # 我们的 app 不使用这些网络依赖，直接清空即可避免整条依赖链。
          python3 - <<'EOF'
          import re
          p = '/tmp/p4a/pythonforandroid/recipes/kivy/__init__.py'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r'python_depends\s*=\s*\[[^\]]*\]',
                      'python_depends = []', s)
          assert s2 != s, 'pattern not found'
          open(p, 'w', encoding='utf-8').write(s2)
          print('patched kivy python_depends -> []')
          EOF

      - name: Build APK (release)
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -ex
          # p4a 内置的 P4A_RELEASE_* 签名不可靠（p4a#1350 复现），此处先产出 unsigned APK，
          # 由下一步用 apksigner 显式做 v2/v3 签名。
          buildozer android release

      - name: Sign APK with apksigner (v2/v3)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          set -ex
          # 从 Secret 恢复 keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > colorassistant-release.jks
          ls -l colorassistant-release.jks
          # 定位 SDK 自带 apksigner（buildozer 已安装 SDK/build-tools）
          APKSIGNER=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ | tail -1)apksigner
          echo "Using apksigner: $APKSIGNER"
          UNSIGNED=bin/colorassistant-1.0.0-arm64-v8a-release-unsigned.apk
          ls -l "$UNSIGNED"
          # 对 unsigned APK 做 v2+v3 签名（apksigner 自动对齐，比 jarsigner 更稳）
          "$APKSIGNER" sign \
            --ks colorassistant-release.jks \
            --ks-key-alias colorassistant \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASS" \
            --key-pass "pass:$RELEASE_KEYSTORE_PASS" \
            --out bin/colorassistant-1.0.0-release-signed.apk \
            "$UNSIGNED"
          # 移除 unsigned 产物，避免上传误用
          rm -f "$UNSIGNED"
          # 校验签名并打印证书信息
          "$APKSIGNER" verify --print-certs bin/colorassistant-1.0.0-release-signed.apk
          echo "=== Signed APK ready ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorassistant-release-apk
          path: bin/*.apk
          retention-days: 30

      - name: Print build info
        if: always()
        run: |
          echo "=== Build complete ==="
          ls -lh bin/ 2>/dev/null || echo "No bin/ directory (build may have failed)"
          echo ""
          echo "If build succeeded, download the APK from the Artifacts section above."
